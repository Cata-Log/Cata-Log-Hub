services:
  cata-log-hub:
    image: cata-log-hub:latest
    container_name: cata-log-hub
    volumes:
      - cata-log-storage:/mnt/storage
      - cata-log-db:/mnt/db
      - cata-log-logs:/var/log/cata-log
      - cata-log-plugins:/mnt/plugins
    ports:
      - 2424:8000
    environment:
      - CATA_LOG_PASSWORD=test1234 # gitleaks:allow
      - CATA_LOG_LOG_LEVEL=DEBUG
      - CATA_LOG_DEV_MODE=True
    restart: unless-stopped


volumes:
  cata-log-storage:
  cata-log-db:
  cata-log-logs:
  cata-log-plugins:
