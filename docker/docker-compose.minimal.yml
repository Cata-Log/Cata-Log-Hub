services:
  cata-log-hub:
    image: cata-log-hub:latest
    container_name: cata-log
    volumes:
      - /path/to/cata-log-hub/storage:/mnt/storage
      - /path/to/cata-log-hub/db:/mnt/db
      - /path/to/cata-log-hub/log:/var/log/cata-log
      - /path/to/cata-log-hub/plugins:/mnt/plugins
    ports:
      - 2424:8000
    environment:
      - CATA_LOG_PASSWORD=SafE_pAs5w0rd # setting no password makes authentication impossible #gitleaks:allow
      - CATA_LOG_ALLOWED_HOSTS=["127.0.0.1","localhost"] # hostnames that are allowed to serve this instance
    restart: unless-stopped
